<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Edit Comment - OOAD_Blog_Application')}"></head>
<body>

<header th:replace="~{layout :: header(${loggedInUser})}"></header>

<main class="container form-container">
    <div class="form-card glass-panel">
        <h1>Edit your Comment</h1>
        
        <form th:action="'/comment/' + ${comment.id} + '/edit'" method="post" class="blog-form">
            <div class="form-group">
                <textarea id="content" name="content" th:text="${comment.content}" required placeholder="Your comment..." class="input-content" rows="5" autofocus></textarea>
            </div>
            <div class="form-actions">
                <a th:href="'/blog/' + ${comment.blog.id}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
