<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${blog.id == null ? 'New Draft' : 'Edit Post'} + ' - OOAD_Blog_Application')}"></head>
<body>

<header th:replace="~{layout :: header(${loggedInUser})}"></header>

<main class="container form-container">
    <div class="form-card glass-panel">
        <h1 th:text="${blog.id == null ? 'Write a Story' : 'Edit your Story'}">Form Title</h1>
        
        <form th:action="${blog.id == null ? '/blog/new' : '/blog/' + blog.id + '/edit'}" method="post" enctype="multipart/form-data" class="blog-form">
            <div class="form-group form-group-lg">
                <input type="text" id="title" name="title" th:value="${blog.title}" required placeholder="Title" class="input-title" autofocus>
            </div>
            
            <!-- Current Image Preview (for edit mode) -->
            <div th:if="${blog.id != null and blog.base64Image != null}" class="form-group" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #f9f9f9;">
                <label>Current Cover Image</label>
                <div style="margin: 10px 0;">
                    <img th:src="@{'data:image/jpeg;base64,' + ${blog.base64Image}}" alt="Current Cover" style="max-width: 100%; max-height: 300px; border-radius: 8px; object-fit: cover;">
                </div>
                <div style="margin: 10px 0;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
                        <input type="checkbox" id="removeImage" name="removeImage" value="true">
                        <span>Remove current image</span>
                    </label>
                </div>
                <small style="color: #666;">Upload a new image below to replace it, or check the box above to remove it</small>
            </div>
            
            <div class="form-group image-upload-group">
                <label for="images" th:text="${blog.id == null ? 'Images (Optional)' : 'Replace Cover Image (Optional)'}">Images (Optional)</label>
                <input type="file" id="images" name="images" accept="image/*" class="input-file" th:attr="multiple=${blog.id == null}">
            </div>
            <div class="form-group">
                <textarea id="content" name="content" th:text="${blog.content}" required placeholder="Tell your story..." class="input-content" rows="15"></textarea>
            </div>
            <div class="form-actions">
                <a th:href="${blog.id == null ? '/' : '/blog/' + blog.id}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" th:text="${blog.id == null ? 'Publish' : 'Save Changes'}">Submit</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
